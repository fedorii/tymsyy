<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — TYMCYY</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-logo">
    <span class="logo-icon">◈</span>
    <span class="logo-text">TYMCYY</span>
  </div>
  <h1 class="auth-title">Войти</h1>
  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="auth-form">
    <div class="field">
      <label>Логин</label>
      <input type="text" name="username" required autocomplete="username" placeholder="ваш_логин">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" name="password" required autocomplete="current-password" placeholder="••••••">
    </div>
    <button type="submit" class="btn-primary">Войти</button>
  </form>
  <p class="auth-switch">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
</div>
</body>
</html>
